<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GarbageOpt — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    html, body { height: 100%; overflow: auto; display: flex; align-items: center; justify-content: center; background: #f7f7f7; }
    .auth-box { background: #fff; border: 1px solid #e4e4e4; border-radius: 8px; padding: 2rem; width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .auth-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
    .auth-sub { font-size: 0.75rem; color: #999; margin-bottom: 1.5rem; }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border: 1px solid #e4e4e4; border-radius: 6px; overflow: hidden; }
    .auth-tab { flex: 1; padding: 8px; text-align: center; font-size: 0.78rem; font-weight: 600; cursor: pointer; background: #f7f7f7; color: #999; border: none; transition: all 0.15s; }
    .auth-tab.active { background: #0a0a0a; color: #fff; }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .form-group label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #999; }
    .form-group input { background: #f7f7f7; border: 1px solid #e4e4e4; border-radius: 6px; padding: 9px 12px; font-family: Inter, sans-serif; font-size: 0.85rem; outline: none; transition: border-color 0.15s; color: #0a0a0a; }
    .form-group input:focus { border-color: #0a0a0a; background: #fff; }
    .err { font-size: 0.75rem; color: #c0392b; background: #fff5f5; border: 1px solid #f5c0c0; border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
<div class="auth-box">
  <div class="auth-title">GarbageOpt</div>
  <div class="auth-sub">Smart Garbage Collection System</div>
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Login</button>
    <button class="auth-tab" onclick="switchTab('register')">Register</button>
  </div>
  <div id="err" class="err"></div>

  <!-- Login form -->
  <div id="login-form">
    <div class="form-group"><label>Email</label><input id="l-email" type="email" placeholder="you@example.com"></div>
    <div class="form-group"><label>Password</label><input id="l-pass" type="password" placeholder="Password"></div>
    <button class="btn-primary full-width" onclick="login()">Login</button>
  </div>

  <!-- Register form -->
  <div id="register-form" style="display:none">
    <div class="form-group"><label>Name</label><input id="r-name" type="text" placeholder="Your name"></div>
    <div class="form-group"><label>Email</label><input id="r-email" type="email" placeholder="you@example.com"></div>
    <div class="form-group"><label>Password</label><input id="r-pass" type="password" placeholder="Min 6 characters"></div>
    <button class="btn-primary full-width" onclick="register()">Create Account</button>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('err').style.display = 'none';
}

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
}

async function login() {
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-pass').value;
  if (!email || !password) return showErr('Please fill in all fields');
  const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
  const data = await res.json();
  if (!res.ok) return showErr(data.error);
  location.href = '/';
}

async function register() {
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const password = document.getElementById('r-pass').value;
  if (!name || !email || !password) return showErr('Please fill in all fields');
  if (password.length < 6) return showErr('Password must be at least 6 characters');
  const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name,email,password}) });
  const data = await res.json();
  if (!res.ok) return showErr(data.error);
  location.href = '/';
}

// Enter key support
document.addEventListener('keydown', e => { if (e.key==='Enter') { if (document.getElementById('login-form').style.display!=='none') login(); else register(); } });
</script>
</body>
</html>
